<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<style>
:root{--paper:#FAFAF7;--ink:#2B2F2E;--mute:#5C6461;--line:#E3E6E0;--sky:#3A9BDC;--sky-deep:#1F6FA8;--sky-tint:#E6F2FB;--sage-ink:#3F7A4C;--sage-tint:#EAF3EC}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:1200px;overflow:hidden}
body{background:var(--paper);font-family:Inter,sans-serif;color:var(--ink);padding:84px 80px 0}
.eyebrow{font:900 24px Nunito,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--sage-ink)}
h1{font:900 92px/0.95 Nunito,sans-serif;letter-spacing:-.02em;margin-top:14px}
h1 em{font-style:normal;color:var(--sky)}
.dose{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:56px}
.card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:56px 20px 48px;text-align:center;display:grid;justify-items:center;gap:14px}
.sh{height:190px;display:flex;align-items:center;gap:10px}
.sh i{display:block;width:92px;height:122px;border-radius:12px;background:linear-gradient(140deg,#5AAEE6,#1F6FA8);box-shadow:0 10px 20px rgba(31,111,168,.25);transform:rotate(-6deg)}
.sh i:nth-child(2){transform:rotate(5deg)}
.sh i.half{width:46px;border-radius:12px 0 0 12px}
.card b{font:900 42px/1 Nunito,sans-serif}
.card span{font:600 24px/1.3 Inter,sans-serif;color:var(--mute)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:56px}
.step{display:grid;grid-template-columns:64px 1fr;gap:16px;align-items:center}
.step .n{width:64px;height:64px;border-radius:50%;background:var(--sky-deep);color:#fff;display:grid;place-items:center;font:900 34px Nunito,sans-serif}
.step p{font:800 28px/1.2 Nunito,sans-serif}
.foot{margin-top:64px;background:var(--sage-tint);border-radius:22px;padding:24px 30px;display:flex;justify-content:space-between;font:800 27px Nunito,sans-serif;color:var(--sage-ink)}
</style></head>
<body>
<p class="eyebrow">How to use</p>
<h1>Tear, drop, <em>done.</em><br>No measuring cup.</h1>
<div class="dose">
  <div class="card"><div class="sh"><i class="half"></i></div><b>Half</b><span>Small load</span></div>
  <div class="card"><div class="sh"><i></i></div><b>One</b><span>Regular load</span></div>
  <div class="card"><div class="sh"><i></i><i></i></div><b>Two</b><span>Big or extra-dirty load</span></div>
</div>
<div class="steps">
  <div class="step"><span class="n">1</span><p>Sheet into the drum first</p></div>
  <div class="step"><span class="n">2</span><p>Clothes on top</p></div>
  <div class="step"><span class="n">3</span><p>Wash like you always do</p></div>
</div>
<div class="foot"><span>HE and standard washers</span><span>Top and front loaders</span></div>
</body></html>
