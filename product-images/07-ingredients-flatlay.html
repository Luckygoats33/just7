<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#2B2F2E;--mute:#5C6461;--sky:#3A9BDC;--sky-deep:#1F6FA8;--sun:#FFC94A}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:1200px;overflow:hidden}
body{font-family:Inter,sans-serif;position:relative;color:var(--ink)}
.ph{position:absolute;inset:0;width:1200px;height:1200px;object-fit:cover}
.cap{position:absolute;left:64px;top:64px;max-width:640px}
.eyebrow{font:900 24px Nunito,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#3F7A4C}
h1{font:900 80px/0.98 Nunito,sans-serif;letter-spacing:-.02em;margin-top:12px}
h1 em{font-style:normal;color:var(--sky-deep)}
p.s{font:600 26px/1.35 Inter,sans-serif;color:var(--mute);margin-top:16px}
.ph{top:110px;height:1090px;object-position:center 40%}
body{background:rgb(245,241,238)}
.top{position:absolute;left:0;right:0;top:44px;text-align:center}
.top h1{font-size:64px;margin:0}
.lb{position:absolute;width:230px;text-align:center;font:800 21px/1 Nunito,sans-serif;color:var(--ink);background:#fff;border-radius:30px;padding:7px 10px;box-shadow:0 4px 12px rgba(43,47,46,.10);white-space:nowrap}
.lb b{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--sky-deep);color:#fff;font:900 17px Nunito,sans-serif;margin-right:8px;vertical-align:middle}
.tabs{position:absolute;left:0;right:0;bottom:44px;text-align:center;font:800 27px Nunito,sans-serif;color:var(--sky-deep)}
</style></head><body>
<img class="ph" src="src/tabs/photo-flatlay.jpg" alt="">
<div class="top"><h1>Just <em>7</em> ingredients. That's the tab.</h1></div>
<div class="lb" style="left:46px;top:582px"><b>1</b>Washing soda</div>
<div class="lb" style="left:336px;top:582px"><b>2</b>Citric acid</div>
<div class="lb" style="left:628px;top:582px"><b>3</b>Sodium citrate</div>
<div class="lb" style="left:921px;top:582px"><b>4</b>Cellulose</div>
<div class="lb" style="left:172px;top:902px"><b>5</b>Lauryl glucoside</div>
<div class="lb" style="left:479px;top:902px"><b>6</b>Decyl glucoside</div>
<div class="lb" style="left:787px;top:902px"><b>7</b>Water</div>
<div class="tabs">Pressed into one 4 g tab. Nothing else added.</div>
</body></html>
