<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#2B2F2E;--mute:#5C6461;--sky:#3A9BDC;--sky-deep:#1F6FA8;--sun:#FFC94A}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:1200px;overflow:hidden}
body{font-family:Inter,sans-serif;position:relative;color:var(--ink)}
.ph{position:absolute;inset:0;width:1200px;height:1200px;object-fit:cover}
.cap{position:absolute;left:64px;top:64px;max-width:640px}
.eyebrow{font:900 24px Nunito,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#3F7A4C}
h1{font:900 80px/0.98 Nunito,sans-serif;letter-spacing:-.02em;margin-top:12px}
h1 em{font-style:normal;color:var(--sky-deep)}
p.s{font:600 26px/1.35 Inter,sans-serif;color:var(--mute);margin-top:16px}
.ph{object-position:center}
.cap{top:auto;bottom:64px;background:rgba(251,250,246,.93);border-radius:28px;padding:30px 36px;max-width:760px}
h1{font-size:64px}
</style></head><body>
<img class="ph" src="src/tabs/photo-closeup.jpg" alt="">
<div class="cap"><p class="eyebrow">Meet the tab</p><h1>Pressed, not <em>wrapped.</em></h1><p class="s">4 g, about 30 mm across. No film around it, no PVA, no plastic jug.</p></div>
</body></html>
