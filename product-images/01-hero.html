<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<style>
:root{--paper:#FAFAF7;--ink:#2B2F2E;--sky-deep:#1F6FA8}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:1200px;overflow:hidden}
body{background:#F6F3EE;font-family:Inter,sans-serif;position:relative}
.ph{position:absolute;inset:0;width:1200px;height:1200px;object-fit:cover}
.tag{position:absolute;right:46px;top:60px;width:220px;height:220px;border-radius:50%;background:var(--sky-deep);color:#fff;display:grid;place-items:center;text-align:center;transform:rotate(8deg);box-shadow:0 10px 24px rgba(31,111,168,.3)}
.tag b{display:block;font:900 88px/0.9 Nunito,sans-serif}
.tag span{display:block;font:800 23px/1.15 Nunito,sans-serif;letter-spacing:.02em}
.foot{position:absolute;left:50%;transform:translateX(-50%);bottom:34px;white-space:nowrap;background:rgba(255,255,255,.92);border-radius:40px;padding:14px 30px;font:800 30px Nunito,sans-serif;color:var(--ink);box-shadow:0 6px 18px rgba(43,47,46,.08)}
.foot i{font-style:normal;color:var(--sky-deep)}
</style></head>
<body>
<img class="ph" src="src/tabs/photo-pouch-tabs.jpg" alt="">
<div class="tag"><div><b>60</b><span>tabs in<br>one pouch</span></div></div>
<div class="foot">1 tab a load <i>·</i> Fragrance-free <i>·</i> No film, no PVA</div>
</body></html>
