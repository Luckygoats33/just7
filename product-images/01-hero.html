<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<style>
:root{--paper:#FAFAF7;--ink:#2B2F2E;--mute:#5C6461;--sky:#3A9BDC;--sky-deep:#1F6FA8;--sky-tint:#E6F2FB;--sage:#5E9C6B}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:1200px;overflow:hidden}
body{background:var(--paper);font-family:Inter,sans-serif;position:relative}
.glow{position:absolute;width:980px;height:980px;border-radius:50%;left:110px;top:150px;background:radial-gradient(circle at 50% 45%,#DCEEFA 0,#EAF4FB 45%,rgba(250,250,247,0) 70%)}
.floor{position:absolute;left:250px;top:1010px;width:700px;height:70px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(31,111,168,.22) 0,rgba(31,111,168,0) 70%);filter:blur(6px)}
.sheet{position:absolute;width:440px;height:340px;border-radius:14px;background:linear-gradient(135deg,#FFFFFF 0%,#F2F6F8 60%,#E8EEF1 100%);box-shadow:0 2px 0 rgba(255,255,255,.9) inset,0 18px 40px rgba(43,47,46,.12),0 2px 6px rgba(43,47,46,.08)}
.sheet::after{content:"";position:absolute;inset:18px;border-radius:8px;background:repeating-linear-gradient(90deg,rgba(58,155,220,.035) 0 6px,transparent 6px 14px)}
.s1{left:640px;top:520px;transform:rotate(16deg)}
.s2{left:610px;top:600px;transform:rotate(4deg)}
.pouch{position:absolute;left:250px;top:150px;width:560px;height:840px;border-radius:10px;overflow:hidden;transform:rotate(-5deg);box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 40px 70px rgba(31,111,168,.25),0 12px 24px rgba(43,47,46,.18)}
.pouch img{width:100%;height:100%;display:block}
.pouch::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,0) 32%,rgba(0,0,0,0) 70%,rgba(0,0,0,.08) 100%)}
.seal{position:absolute;left:0;right:0;top:0;height:16px;background:linear-gradient(rgba(0,0,0,.10),rgba(0,0,0,0))}
.tag{position:absolute;right:70px;top:90px;width:230px;height:230px;border-radius:50%;background:var(--sky-deep);color:#fff;display:grid;place-items:center;text-align:center;transform:rotate(8deg);box-shadow:0 10px 24px rgba(31,111,168,.3)}
.tag b{display:block;font:900 92px/0.9 Nunito,sans-serif}
.tag span{display:block;font:800 24px/1.15 Nunito,sans-serif;letter-spacing:.02em}
.foot{position:absolute;left:0;right:0;bottom:56px;text-align:center;font:800 30px Nunito,sans-serif;color:var(--ink);letter-spacing:.01em}
.foot i{font-style:normal;color:var(--sky-deep)}
</style></head>
<body>
<div class="glow"></div>
<div class="floor"></div>
<div class="sheet s1"></div>
<div class="sheet s2"></div>
<div class="pouch"><img src="src/just-7-pouch-front.jpg" alt=""><div class="seal"></div></div>
<div class="tag"><div><b>60</b><span>loads in<br>one pouch</span></div></div>
<div class="foot">30 sheets <i>·</i> Fragrance-free <i>·</i> No PVA film</div>
</body></html>
